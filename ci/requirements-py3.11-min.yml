name: test_env
channels:
    # - defaults  # not supported by mamba
    - conda-forge
dependencies:
    - python=3.11
    - coveralls
    - pip
    - pytest
    - pytest-cov
    - pytest-mock
    - pytest-timeout
    - pytz
    - requests
    - pip:
        - h5py==3.8.0
        - numpy==1.23.2
        - pandas==1.5.0
        - scipy==1.9.2
        - pytest-rerunfailures # conda version is >3.6
        - pytest-remotedata # conda package is 0.3.0, needs > 0.3.1
        - requests-mock
