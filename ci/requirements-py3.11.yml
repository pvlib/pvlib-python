name: test_env
channels:
    # - defaults  # not supported by mamba
    - conda-forge
dependencies:
    - python=3.11
    - coveralls
    - cython
    - ephem
    - h5py
    - numba
    - numpy >= 1.21.2
    - pandas >= 1.3.3
    - pip
    - pytest
    - pytest-cov
    - pytest-mock
    - requests-mock
    - pytest-timeout
    - pytest-rerunfailures
    - conda-forge::pytest-remotedata  # version in default channel is old
    - pytz
    - requests
    - scipy >= 1.7.2
    - statsmodels
    - pip:
        - nrel-pysam>=2.0
        - solarfactors
